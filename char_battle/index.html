canvas{display:block}

var AudioMgr = {
  sounds: {},
  muted: false,
  vol: 0.7,
  ctx: null,      // Web Audio 上下文（仅用于切片）
  buffers: {},    // 预解码的 AudioBuffer

  init: function(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) this.ctx = new AC();
    var self = this;
    var unlock = function(){
      if(self.ctx && self.ctx.state === 'suspended') self.ctx.resume();
      for(var k in self.sounds){
        var s = self.sounds[k];
        if(s){ s.play().catch(function(){}); s.pause(); s.currentTime = 0; }
      }
      document.removeEventListener('click', unlock);
      document.removeEventListener('touchstart', unlock);
    };
    document.addEventListener('click', unlock, {once:true});
    document.addEventListener('touchstart', unlock, {once:true});
  },

  // 普通整段播放（给其他技能用）
  add: function(name, src){
    var a = new Audio();
    a.src = src; a.preload = 'auto'; a.volume = this.vol;
    this.sounds[name] = a;
  },

  play: function(name, opts){
    if(this.muted) return;
    opts = opts || {};
    var s = this.sounds[name];
    if(!s) return;
    var c = s.cloneNode();
    c.volume = this.vol * (opts.gain || 1);
    c.playbackRate = opts.rate || 1;
    var p = c.play(); if(p && p.catch) p.catch(function(){});
    c.onended = function(){ c = null; };
  },

  // 预解码：把 MP3 载入为 AudioBuffer，供精确切片
  loadSlice: function(name, src){
    var self = this;
    if(!this.ctx) return;
    fetch(src)
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){ return self.ctx.decodeAudioData(ab); })
      .then(function(decoded){
        self.buffers[name] = decoded;
        console.log('[Audio] 切片就绪:', name);
      })
      .catch(function(e){ console.warn('[Audio] 解码失败:', name); });
  },

  // 播放切片：从 offset(秒) 开始，只播 duration(秒)
  playSlice: function(name, offset, duration, opts){
    if(this.muted) return;
    opts = opts || {};
    var buf = this.buffers[name];
    if(!buf || !this.ctx) return;
    var srcNode = this.ctx.createBufferSource();
    srcNode.buffer = buf;
    srcNode.playbackRate.value = opts.rate || 1;
    var g = this.ctx.createGain();
    g.gain.value = this.vol * (opts.gain || 1);
    srcNode.connect(g);
    g.connect(this.ctx.destination);
    srcNode.start(0, offset || 0, duration || 0.12);
  },
  stopAll: function(){
    // 停止所有普通音效
    for(var k in this.sounds){
        var s = this.sounds[k];
        if(s){
            s.pause();
            s.currentTime = 0;
        }
    }
    // 停止所有克隆节点（防止残留）
    var allAudio = document.querySelectorAll('audio');
    for(var i = 0; i < allAudio.length; i++){
        allAudio[i].pause();
        allAudio[i].currentTime = 0;
    }
    // 停止 Web Audio 切片
    if(this.ctx && this.ctx.state === 'running'){
        this.ctx.suspend();
        // 0.1秒后恢复上下文，避免后续无法播放
        setTimeout(function(){ if(AudioMgr.ctx) AudioMgr.ctx.resume(); }, 100);
    }
}
};

function standAtk(c,o,ignoreInv){
    var nowJ=performance.now(),dto=Math.sqrt((c.x-o.x)*(c.x-o.x)+(c.y-o.y)*(c.y-o.y));
    c.fightPose=dto<c.def.attackRange;
        // 战斗结束或承太郎死亡：强制停掉欧拉音效
    if(o.hp<=0 || c.dead){
        if(c.oraAudio){
            c.oraAudio.pause();
            c.oraAudio.currentTime=0;
            if(c.oraAudio.parentNode) c.oraAudio.parentNode.removeChild(c.oraAudio);
            c.oraAudio=null;
            c.oraMinPlayUntil=0;
        }
        c.fightPose=false;
        return;
    }
    
    // 退出欧拉范围后，至少再播 0.5 秒才停
    if(c.oraAudio && !c.fightPose){
        if(nowJ >= (c.oraMinPlayUntil||0)){
            c.oraAudio.pause();
            c.oraAudio.currentTime=0;
            if(c.oraAudio.parentNode) c.oraAudio.parentNode.removeChild(c.oraAudio);
            c.oraAudio=null;
            c.oraMinPlayUntil=0;
        }
        return; // 退出范围时不执行伤害
    }
    
    if(!c.fightPose || o.hp<=0) return;
    
    if(!c.oraLast)c.oraLast=0;
    if(nowJ-c.oraLast>=c.def.oraInterval){
        c.oraLast=nowJ;
        c.oraN=(c.oraN||0)+1;
        var od=Math.round(c.def.oraDmg);
        dd(o, od, c, {ignoreInv: ignoreInv, noInvFrame: true});
        sD(o.x,o.y-o.r,od,"#ffffff");
        sP(o.x,o.y,"#00ccff",6,4);
        sTxt(c.x+(Math.random()-.5)*50,c.y-c.r-35-Math.random()*25,"欧啦!","#00ccff",18,40); 
        sS(o.x, o.y, 80, "#ddeeff");
        sT = 3; sx = (Math.random()-.5)*6; sy = (Math.random()-.5)*6;
        
        // 启动音效，同时设定"至少播到什么时候"
        if(!c.oraAudio){
    var snd=AudioMgr.sounds['ora'];
    if(snd){
        c.oraAudio=snd.cloneNode();
        c.oraAudio.loop=true;
        c.oraAudio.volume=AudioMgr.vol*0.7;
        c.oraAudio.style.display='none';           // ← 隐藏
        document.body.appendChild(c.oraAudio);       // ← 插入DOM
        c.oraAudio.play().catch(function(){});
        c.oraMinPlayUntil=nowJ+350;
    }
}
        
        if(c.oraN%c.def.oraNeedCount===0){
            var hd=Math.round(c.def.heavyDmg);
            dd(o, hd, c, {ignoreInv: ignoreInv, noInvFrame: true});
            sD(o.x,o.y-o.r,hd,"#ff2222");
            sP(o.x,o.y,"#00ccff",30,10);
            sS(o.x,o.y,200,"#ccddee");
            sS(o.x, o.y, 140, "#00ccff");
            sT = 8; sx = (Math.random()-.5)*14; sy = (Math.random()-.5)*14;
            if(!noFly(o)){
                kb(o,c.x,c.y,c.def.knockPower);

            sy=(Math.random()-.5)*20;
            sTxt(o.x,o.y-o.r-60,"欧啦!!!","#00ccff",34,90);
        }
    }
}

// 承太郎专用伤害结算：支持护盾，但不触发无敌帧（保证欧拉连打流畅）
function barrierAbsorb(tg, amt){
    if(!tg.barrier || amt <= 0) return amt;
    var abs = Math.min(amt, tg.barrierHP);
    tg.barrierHP -= abs;
    amt -= abs;
    sP(tg.x, tg.y, "#4488ff", 8, 4);
    if(tg.barrierHP <= 0){
        tg.barrier = false;
        tg.barrierCD = tg.def.barrierCD || 1080;
        sS(tg.x, tg.y, tg.r + 20, "#4488ff");
        sTxt(tg.x, tg.y - tg.r - 55, "屏障破碎!", "#4488ff", 20, 360);
    }
    return amt;
}

function dd(tg, amt, src, options) {
    if (typeof options === 'boolean') { options = {ignoreInv: options}; }
    options = options || {};
    var ignoreInv = options.ignoreInv;
    var noInvFrame = options.noInvFrame;
    var noShake = options.noShake;
    var noDmgNum = options.noDmgNum;

    var _rm = escRed(tg);
    if (amt > 0 && _rm <= 0) {
        sTxt(tg.x, tg.y - tg.r - 50, "免疫", "#aaccff", 16, 50);
        return;
    }
    amt *= _rm;
    if (amt <= 0) return;

    if (tg.def.type === "baie" && tg.state === "stance") {
        amt = amt * (1 - tg.def.stanceDmgReduce);
        if (Math.random() < 0.3) sP(tg.x, tg.y, "#ffaa00", 3, 2);
    }
    if (amt <= 0) return;

    if (tg.barrier) {
        var abs = Math.min(amt, tg.barrierHP);
        tg.barrierHP -= abs;
        amt -= abs;
        sP(tg.x, tg.y, "#4488ff", 8, 4);
        if (tg.barrierHP <= 0) {
            tg.barrier = false;
            tg.barrierCD = tg.def.barrierCD || 1080;
            sS(tg.x, tg.y, tg.r + 20, "#4488ff");
            sTxt(tg.x, tg.y - tg.r - 55, "屏障破碎!", "#4488ff", 20, 360);
        }
        if (amt <= 0) return;
    }

    if (!ignoreInv && tg.inv > 0) return;

    tg.hp -= amt;
    tg.flash = 8;
    if (!noInvFrame) {
        tg.inv = 30;
    }

    if (!noDmgNum) {
        sD(tg.x, tg.y - tg.r, amt, amt > 200 ? "#ff2222" : amt > 40 ? "#ffaa00" : "#ffffff");
    }
    sP(tg.x, tg.y, tg.def.color, Math.min(35, amt / 3), 5);
    sS(tg.x, tg.y, tg.r + 15 + amt / 4, tg.def.color);
    if (amt > 100 && !noShake) {
        sT = 20; sx = (Math.random() - .5) * 14; sy = (Math.random() - .5) * 14;
        freeze = 5;
    }
}
